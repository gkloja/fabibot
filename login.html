<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar na Fabi | Sua comunidade em um só lugar</title>
<meta name="description" content="Entre na Fabi para gerenciar sessões, grupos e configurações da sua comunidade.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#07100c">
<link rel="canonical" href="https://www.fabibot.com.br/login">
<link rel="icon" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/fabi-v2.css?v=20261007">
</head>
<body class="fabi-v2-page">
<a class="fabi-skip" href="#conteudo-principal">Pular para o conteúdo</a>
<header class="fabi-topbar">
  <div class="fabi-shell fabi-topbar-in">
    <a class="fabi-brand" href="/"><img src="/flogo.jpg" alt="" width="36" height="36"><span>Fabi</span></a>
    <nav class="fabi-nav" aria-label="Principal">
      <a href="/">Início</a><a href="/conectar">Conectar</a><a href="/comandos">Comandos</a><a href="/sobre">Sobre</a>
    </nav>
  </div>
</header>
<main id="conteudo-principal" class="fabi-shell" tabindex="-1">
  <section class="fabi-form-card fabi-glass" aria-labelledby="loginTitle">
    <span class="fabi-badge">Acesso à plataforma</span>
    <h1 id="loginTitle" style="font-size:clamp(1.65rem,6vw,2.3rem);letter-spacing:-.04em;margin:14px 0 8px">Bem-vindo de volta.</h1>
    <p class="fabi-lead" style="font-size:.96rem;margin:0 0 18px">Entre para gerenciar suas sessões, grupos e configurações da Fabi.</p>
    <div id="msg" class="fabi-status" role="status" aria-live="polite"></div>
    <form id="loginForm" novalidate>
      <div class="fabi-field">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" required autocomplete="username" inputmode="text" placeholder="Seu usuário">
      </div>
      <div class="fabi-field">
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Sua senha">
      </div>
      <button class="fabi-btn fabi-btn-primary" style="width:100%;margin-top:16px" type="submit" id="btn">Entrar</button>
    </form>
    <div style="margin-top:18px;color:var(--fabi-muted);font-size:.86rem;line-height:1.65">
      Ainda não possui acesso? <a href="https://chat.whatsapp.com/JgJTVYqRpMvBftNLR91U47" target="_blank" rel="noopener" style="color:#baf2d0">Veja como registrar sua conta</a>.
      <br><a href="/" style="color:#baf2d0">← Voltar à Fabi</a>
    </div>
  </section>
</main>
<script>
(function(){
  const PROXY_HOST="https://orange-hill-2e61.gbscabral15.workers.dev";
  const BACKEND="http://br2.bronxyshost.com:4009";
  function urlsFor(path){
    const target=BACKEND.replace(/\/$/,"")+path;
    const hostPath=BACKEND.replace(/^https?:\/\//,"");
    return [
      PROXY_HOST+"/"+hostPath+"/proxy?url="+encodeURIComponent(target),
      PROXY_HOST+"/proxy?url="+encodeURIComponent(target)
    ];
  }
  const params=new URLSearchParams(location.search);
  const redirectTo=params.get("redirect")||"/";
  const msg=document.getElementById("msg"),form=document.getElementById("loginForm"),btn=document.getElementById("btn");
  function show(text,ok){msg.className="fabi-status "+(ok?"ok":"error");msg.textContent=text;}
  async function tryLogin(username,password){
    const body=JSON.stringify({username,password});
    const headers={"Content-Type":"application/json","Accept":"application/json"};
    let lastErr=null;
    for(const url of urlsFor("/api/login")){
      try{
        const res=await fetch(url,{method:"POST",headers,body,mode:"cors"});
        const ct=res.headers.get("content-type")||"";
        if(!ct.includes("json")){lastErr="Resposta inválida do servidor";continue;}
        return {res,data:await res.json()};
      }catch(e){lastErr=e.message||String(e);}
    }
    throw new Error(lastErr||"Falha de rede");
  }
  form.addEventListener("submit",async(e)=>{
    e.preventDefault();
    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value;
    if(!username||!password){show("Preencha usuário e senha.",false);return;}
    btn.disabled=true;btn.textContent="Entrando…";msg.className="fabi-status";
    try{
      const {res,data}=await tryLogin(username,password);
      if(res.ok&&data&&data.success){
        const u=data.user||{};
        try{localStorage.removeItem("fabi_session");localStorage.removeItem("neconecta_user_session");}catch(_){}
        const sess={logado:true,id:u.id||u.nome||username,nome:u.nome||username,email:u.email||"",numero:u.numero||"",golds:u.golds||u.dinheiro||0,rank:0,avatar:u.avatar||u.foto||u.fotoPerfil||"/flogo.jpg",provider:"servidor",at:Date.now()};
        localStorage.setItem("fabi_session",JSON.stringify(sess));
        localStorage.setItem("neconecta_user_session",JSON.stringify({id:sess.id,nome:sess.nome,email:sess.email,numero:sess.numero,avatar:sess.avatar,provider:"servidor",seguidores:[],seguindo:[]}));
        show("Tudo certo. Abrindo sua conta…",true);
        setTimeout(()=>{location.href=redirectTo;},350);
        return;
      }
      show((data&&(data.message||data.error))||"Não foi possível entrar. Confira seus dados.",false);
    }catch(err){
      console.error("[Fabi login]",err);
      show("Não foi possível conectar agora. Tente novamente em instantes.",false);
    }finally{btn.disabled=false;btn.textContent="Entrar";}
  });
})();
</script>
<script src="/assets/fabi-v2.js?v=20261007" defer></script>
</body>
</html>
