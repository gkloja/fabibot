<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="50%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0f0a1f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e0a3c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="256" cy="220" r="180" fill="url(#halo)"/>
  
  <!-- Main cube body -->
  <g filter="url(#glow)">
    <!-- Back face suggestion -->
    <path d="M140 180 L256 110 L372 180 L372 320 L256 390 L140 320 Z" fill="url(#face)" stroke="url(#gold)" stroke-width="10"/>
    
    <!-- Top face -->
    <path d="M140 180 L256 110 L372 180 L256 250 Z" fill="#6d28d9" stroke="url(#gold)" stroke-width="8" opacity="0.95"/>
    
    <!-- Front face -->
    <path d="M140 180 L256 250 L256 390 L140 320 Z" fill="#3b0764" stroke="url(#gold)" stroke-width="8"/>
    
    <!-- Right face -->
    <path d="M256 250 L372 180 L372 320 L256 390 Z" fill="#4c1d95" stroke="url(#gold)" stroke-width="8"/>
  </g>
  
  <!-- Golden edges highlight -->
  <g stroke="url(#goldEdge)" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M140 180 L256 110 L372 180"/>
    <path d="M140 180 L256 250 L372 180"/>
    <path d="M256 250 L256 390"/>
  </g>
  
  <!-- Pokéball center -->
  <g transform="translate(256 285)" filter="url(#softGlow)">
    <circle r="48" fill="#1e1b4b" stroke="url(#gold)" stroke-width="8"/>
    <circle r="48" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
    <!-- Top red half -->
    <path d="M-48 0 A48 48 0 0 1 48 0 L0 0 Z" fill="#ef4444"/>
    <!-- Bottom white -->
    <path d="M-48 0 A48 48 0 0 0 48 0 L0 0 Z" fill="#f8fafc"/>
    <!-- Center band -->
    <rect x="-50" y="-6" width="100" height="12" fill="#1e1b4b"/>
    <!-- Center button -->
    <circle r="16" fill="#f8fafc" stroke="#1e1b4b" stroke-width="5"/>
    <circle r="8" fill="#e2e8f0"/>
  </g>
  
  <!-- Corner ornaments -->
  <g fill="url(#gold)" filter="url(#glow)">
    <path d="M130 165 l12 -18 12 18 -12 8z"/>
    <path d="M370 165 l12 -18 12 18 -12 8z"/>
    <path d="M130 330 l12 18 12 -18 -12 -8z"/>
    <path d="M370 330 l12 18 12 -18 -12 -8z"/>
  </g>
  
  <!-- Sparkles -->
  <g fill="#fef3c7" opacity="0.9">
    <circle cx="180" cy="140" r="3"/>
    <circle cx="340" cy="150" r="2.5"/>
    <circle cx="200" cy="360" r="2"/>
    <circle cx="320" cy="370" r="3"/>
    <circle cx="256" cy="100" r="2.5"/>
  </g>
</svg>
