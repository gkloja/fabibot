<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Fabi Bot - Loja Oficial de Figurinhas</title>
  <link rel="icon" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Proxy e configuração de backend (igual ao conectar.html) -->
  <script>
    window.PROXY_HOST = window.PROXY_HOST || "https://orange-hill-2e61.gbscabral15.workers.dev";
    window.API_BACKEND = window.API_BACKEND || "http://br2.bronxyshost.com:4009";

    function apiUrl(path) {
      let target;
      if (!path) {
        target = window.API_BACKEND;
      } else if (path.startsWith("http://") || path.startsWith("https://")) {
        target = path;
      } else if (path.startsWith("/")) {
        target = window.API_BACKEND.replace(/\/$/, "") + path;
      } else {
        target = window.API_BACKEND.replace(/^https?:\/\//, "") + "/" + path;
      }
      const hostPath = window.API_BACKEND.replace(/^https?:\/\//, "");
      return window.PROXY_HOST + "/" + hostPath + "/proxy?url=" + encodeURIComponent(target);
    }
  </script>
  <link rel="stylesheet" href="assets/loja.css">
</head>
<body>

  <!-- ========== HERO SECTION ========== -->
  <header class="hero">
    <div class="hero-content">
      <div class="hero-badge"><i class="fas fa-gift"></i> Figurinhas</div>
      <h1>Transforme sua mídia em <span>figurinha</span></h1>
      <p>Cada figurinha custa <span class="price">15¢</span></p>
      <a href="#catalog" class="btn-hero"><i class="fas fa-shopping-cart"></i> Ver Catálogo</a>
    </div>
  </header>

  <!-- ========== CATÁLOGO ========== -->
  <main>
    <section class="catalog" id="catalog">
      <div class="container">
        <div class="section-header">
          <span class="section-badge">Catálogo</span>
          <h2>Nossas Figurinhas</h2>
        </div>
        
        <div class="catalog-filters">
          <div class="filter-all active" data-filter="all">Todos</div>
          <!-- Filters will be generated dynamically -->
        </div>
        
        <div class="catalog-grid" id="catalogGrid">
          <!-- Figurinhas serão inseridas pelo JavaScript -->
        </div>
      </div>
    </section>
  </main>

  <!-- ========== CARRINHO ========== -->
  <section class="cart-overlay" id="cartOverlay">
    <div class="cart-panel">
      <button class="cart-close"><i class="fas fa-times"></i></button>
      <h2><i class="fas fa-shopping-cart"></i> Meu Carrinho</h2>
      <div class="cart-item-empty" id="cartEmpty">
        <i class="fas fa-shopping-basket"></i>
        <p>Nenhuma figurinha selecionada</p>
      </div>
      <div class="cart-items" id="cartItems">
        <!-- Cart items -->
      </div>
      <div class="cart-summary">
        <p>Total de itens: <span id="cartCount">0</span></p>
        <p>Total: <strong id="cartTotal">R$ 0,00</strong></p>
      </div>
      <button class="btn-continue btn-block" id="checkoutBtn" disabled>
        <i class="fas fa-hand-holding-usd"></i> Finalizar Compra
      </button>
    </div>
  </section>

  <!-- ========== MODAL DE CHECKOUT ========== -->
  <div class="modal-overlay" id="modalOverlay" onclick="fecharModal()"></div>
  <div class="modal-container" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2><i class="fas fa-check-circle"></i> Compra Finalizada</h2>
      <button class="modal-close" onclick="fecharModal()">&times;</button>
    </div>
    <div class="modal-body">
      <p>Obrigado pela sua compra! 🎉</p>
      <p>Total pago: <strong id="modalTotal">R$ 0,00</strong></p>
      <p>Figurinhas compradas: <strong id="modalQtd">0</strong></p>
    </div>
    <div class="modal-footer">
      <button class="btn-continuar" onclick="novaCompra()">Continuar Comprando</button>
    </div>
  </div>

  <script>
    // Cart state
    let carrinho = [];
    let figurinhas = [];

    // Initialize theme
    document.addEventListener('DOMContentLoaded', function() {
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          var d = localStorage.getItem("darkMode");
          if (d === "false") t = "light";
          else t = "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t === "light" ? "light" : "dark";
        if (t === "light") document.documentElement.classList.add("light-mode");
      } catch (_) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.colorScheme = "dark";
      }
    });

    // Load figurinhas from JSON via API
    async function carregarFigurinhas() {
      try {
        const response = await fetch(apiUrl('figurinhas_loja.json'));
        figurinhas = await response.json();
        
        if (!Array.isArray(figurinhas) || figurinhas.length === 0) {
          document.getElementById('catalogGrid').innerHTML = `
            <div class="no-figurinhas">
              <i class="fas fa-gift"></i>
              <h3>Nenhuma figurinha disponível</h3>
              <p>O catálogo está vazio. Use o comando /salvarfig no bot para adicionar figurinhas.</p>
            </div>`;
          return;
        }
        
        exibirFigurinhas(figurinhas);
        // Atualizar contagem no header
        atualizarContadorHeader();
      } catch (error) {
        console.error('Erro ao carregar figurinhas:', error);
        document.getElementById('catalogGrid').innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Erro ao carregar catálogo</h3>
            <p>Não foi possível carregar as figurinhas. Tente novamente mais tarde.</p>
          </div>`;
      }
    }
    
    // Display figurinhas in grid
    function exibirFigurinhas(figs) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';
      
      // Filters
      const filtersDiv = document.querySelector('.catalog-filters');
      filtersDiv.innerHTML = `
        <button class="filter-btn active" data-filter="all">Todos</button>
      `;
      
      const categorias = new Set();
      figs.forEach(fig => {
        const filtro = fig.categoria || 'geral';
        categorias.add(filtro);
        if (!document.querySelector(`[data-filter="${filtro}"]`)) {
          const btn = document.createElement('button');
          btn.className = 'filter-btn' ;
          btn.setAttribute('data-filter', filtro);
          btn.textContent = filtro.charAt(0).toUpperCase() + filtro.slice(1);
          filtersDiv.appendChild(btn);
          btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            filtrarFigurinhas(filtro);
          });
        }
      });
      
      // Add "Todos" button active state
      document.querySelector('.filter-btn').classList.add('active');
      
      // Crie um mapa de categoria para cada figurinha
      figs.forEach((fig, index) => {
        const card = document.createElement('div');
        card.className = 'catalog-card';
        const hasAudio = fig.temAudio === true || fig.temAudio === 'true' || fig.isAnimated === true;
        card.innerHTML = `
          <div class="card-preview" data-id="${fig.id}" data-arquivo="${fig.arquivo}" data-categoria="${fig.categoria || 'geral'}" data-temAudio="${hasAudio}">
            <div class="card-image">
              <img src="figurinhas_loja/previa/${fig.arquivo}" alt="${fig.nome || 'Figurinha'}" loading="lazy" class="card-img">
              ${hasAudio ? '<div class="card-audio-icon"><i class="fas fa-headphones"></i></div>' : ''}
            </div>
            <div class="card-overlay">
              <button class="btn-add" data-index="${index}">
                <i class="fas fa-plus"></i> Adicionar
              </button>
            </div>
          </div>
          <div class="card-info">
            <h3 class="card-title">${fig.nome || 'Figurinha ' + fig.id}</h3>
            <p class="card-price">15¢</p>
            ${hasAudio ? '<span class="audio-tag">🔊 Áudio</span>' : ''}
          </div>
        `;
        grid.appendChild(card);
      });
      
      // Add event listeners for add buttons
      document.querySelectorAll('.btn-add').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const index = this.dataset.index;
          adicionarAoCarrinho(index);
        });
      });
      
      // Preview click to switch to exemplo view
      document.querySelectorAll('.card-preview').forEach(card => {
        card.addEventListener('click', function() {
          const arquivo = this.dataset.arquivo;
          const temAudio = this.dataset.temAudio === 'true';
          mostrarExemplo(arquivo, temAudio);
        });
      });
    }
    
    // Filter figurinhas
    function filtrarFigurinhas(categoria) {
      const grid = document.getElementById('catalogGrid');
      const cards = grid.querySelectorAll('.catalog-card');
      
      grid.innerHTML = '';
      
      const categoriaLower = categoria.toLowerCase();
      
      // Re-add the filter buttons with active state
      const filtersDiv = document.querySelector('.catalog-filters');
      const buttons = filtersDiv.querySelectorAll('.filter-btn');
      filtersDiv.innerHTML = '<button class="filter-btn active" data-filter="all">Todos</button>';
      
      // Re-add other filter buttons (simplified)
      // For now, show all or filter by categoria
      const cardsFiltradas = categoria === 'all' ? cards : Array.from(cards).filter(card => {
        return card.dataset.categoria && card.dataset.categoria.toLowerCase() === categoriaLower;
      });
      
      cardsFiltradas.forEach(card => grid.appendChild(card));
      
      // Re-add event listeners
      document.querySelectorAll('.btn-add').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const index = ... // need index, need to rethink
        });
      });
    }
    
    // Add to cart
    function adicionarAoCarrinho(index) {
      const fig = figurinhas[index];
      if (!fig) return;
      
      // Check if already in cart
      if (carrinho.some(item => item.id === fig.id)) {
        mostrarToast('Esta figurinha já está no carrinho!');
        return;
      }
      
      carrinho.push({
        id: fig.id,
        nome: fig.nome || 'Figurinha ' + fig.id,
        arquivo: fig.arquivo,
        preco: 0.15,
        temAudio: fig.temAudio === true || fig.temAudio === 'true' || fig.isAnimated === true
      });
      
      atualizarCarrinho();
    }
    
    // Remove from cart
    function removerDoCarrinho(id) {
      carrinho = carrinho.filter(item => item.id !== id);
      atualizarCarrinho();
    }
    
    // Update cart UI
    function atualizarCarrinho() {
      const cartCount = document.getElementById('cartCount');
      const cartItems = document.getElementById('cartItems');
      const cartTotal = document.getElementById('cartTotal');
      const cartEmpty = document.getElementById('cartEmpty');
      const checkoutBtn = document.getElementById('checkoutBtn');
      
      const total = carrinho.reduce((sum, item) => sum + item.preco, 0);
      const formattedTotal = total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
      
      cartCount.textContent = carrinho.length;
      cartTotal.textContent = formattedTotal.replace('R$ ', 'R$ ');
      
      // Update checkout button state
      checkoutBtn.disabled = carrinho.length === 0;
      
      if (carrinho.length === 0) {
        cartEmpty.style.display = 'block';
        cartItems.innerHTML = '';
      } else {
        cartEmpty.style.display = 'none';
        cartItems.innerHTML = carrinho.map((item, i) => `
          <div class="cart-item">
            <img src="figurinhas_loja/exemplo/${item.arquivo}" alt="${item.nome}" class="cart-img">
            <div class="cart-item-info">
              <h4 class="cart-item-name">${item.nome}</h4>
              <p class="cart-item-price">${item.preco}¢ ${item.temAudio ? '<span class="audio-icon">🔊</span>' : ''}</p>
            </div>
            <button class="btn-remove" data-index="${i}" title="Remover">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        `).join('');
        
        // Add remove event listeners
        cartItems.querySelectorAll('.btn-remove').forEach(btn => {
          btn.addEventListener('click', function() {
            const index = ...; // need proper index
            removerDoCarrinho(carrinho[index].id);
          });
        });
      }
    }
    
    // Show exemplo view
    function mostrarExemplo(arquivo, temAudio) {
      const catalogSection = document.querySelector('.catalog');
      const cartSection = document.querySelector('.cart-overlay');
      
      // Hide catalog, show cart
      catalogSection.style.display = 'none';
      cartSection.style.display = 'block';
      
      // Set the exemplo image
      const exemploImg = cartSection.querySelector('.main-img');
      if (exemploImg) {
        exemploImg.src = `figurinhas_loja/exemplo/${arquivo}`;
      }
      
      // Add this specific item to cart
      const index = figurinhas.findIndex(f => f.arquivo === arquivo);
      if (index >= 0) {
        adicionarAoCarrinho(index);
      }
    }
    
    // Close cart
    function fecharCarrinho() {
      const catalogSection = document.querySelector('.catalog');
      const cartSection = document.querySelector('.cart-overlay');
      
      catalogSection.style.display = 'block';
      cartSection.style.display = 'none';
      document.getElementById('cartEmpty').style.display = 'block';
      document.getElementById('cartItems').innerHTML = '';
    }
    
    // Checkout
    function finalizarCompra() {
      if (carrinho.length === 0) return;
      
      document.getElementById('modalTotal').textContent = carrinho.reduce((sum, item) => sum + item.preco, 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
      document.getElementById('modalQtd').textContent = carrinho.length;
      document.getElementById('modalOverlay').style.display = 'block';
    }
    
    // New game
    function novaCompra() {
      carrinho = [];
      atualizarCarrinho();
      document.getElementById('modalOverlay').style.display = 'none';
      document.querySelector('.catalog').style.display = 'block';
    }
    
    // Toast
    function mostrarToast(mensagem) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = mensagem;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', carregarFigurinhas);
  </script>

  <style>
    /* ========== VARIÁVEIS CSS ========== */
    :root {
      --primary: #e91e63;
      --primary-dark: #c2185b;
      --bg: #0d0d0d;
      --bg-light: #1a1a1a;
      --card: #1f1f1f;
      --border: #333;
      --text: #fff;
      --text-secondary: #b0b0b0;
      --success: #4caf50;
    }
    
    body.light-mode {
      --bg: #fafafa;
      --bg-light: #fff;
      --card: #fff;
      --border: #e0e0e0;
      --text: #111;
      --text-secondary: #444;
    }
    
    /* ========== HERO SECTION ========== */
    .hero {
      position: relative;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: var(--text);
      padding: 80px 20px;
      text-align: center;
    }
    
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
    }
    
    .hero-content {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }
    
    .hero h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 15px;
    }
    
    .hero h1 span {
      color: #fff;
      background: none;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .price {
      background: var(--primary);
      color: var(--text);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.5rem;
    }
    
    .btn-hero {
      background: var(--text);
      color: var(--primary);
      padding: 12px 30px;
      border-radius: 25px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .btn-hero:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(233,30,99,0.3);
    }
    
    /* ========== CATÁLOGO ========== */
    .catalog {
      padding: 60px 20px;
      background: var(--bg);
    }
    
    .catalog .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .section-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .section-header .section-badge {
      display: inline-block;
      background: var(--primary);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }
    
    .section-header h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
    }
    
    /* Catalog filters */
    .catalog-filters {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    .filter-btn {
      background: var(--card);
      color: var(--text-secondary);
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .filter-btn.active {
      background: var(--primary);
      color: var(--text);
    }
    
    .filter-btn:hover:not(.active) {
      background: var(--card);
    }
    
    /* Catalog grid */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    
    .catalog-card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    
    .catalog-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 35px rgba(0,0,0,0.3);
    }
    
    body.light-mode .catalog-card:hover {
      box-shadow: 0 16px 35px rgba(0,0,0,0.05);
    }
    
    .card-preview {
      position: relative;
      height: 200px;
      overflow: hidden;
    }
    
    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    
    .catalog-card:hover .card-preview img {
      transform: scale(1.08);
    }
    
    /* Audio icon */
    .card-audio-icon {
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--primary);
      color: var(--text);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    
    .card-info {
      padding: 15px;
    }
    
    .card-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .card-price {
      color: var(--primary);
      font-weight: 700;
      font-size: 0.75rem;
    }
    
    .audio-tag {
      background: var(--primary);
      color: var(--text);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.65rem;
      font-weight: 600;
      margin-left: 6px;
    }
    
    /* ========== CARRINHO ========== */
    .cart-overlay {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 320px;
      background: var(--bg-light);
      z-index: 100;
      transform: translateX(100%);
      transition: transform 0.3s ease;
      border-left: 4px solid var(--primary);
    }
    
    .cart-overlay.active {
      transform: translateX(0);
    }
    
    .cart-panel {
      padding: 20px;
    }
    
    .cart-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      float: right;
      font-size: 1.5rem;
      cursor: pointer;
    }
    
    .cart-item-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
    }
    
    .cart-item-empty i {
      font-size: 2rem;
      margin-bottom: 10px;
    }
    
    .cart-items {
      max-height: 300px;
      overflow-y: auto;
    }
    
    .cart-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    
    .cart-item:last-child {
      border-bottom: none;
    }
    
    .cart-item img {
      width: 50px;
      height: 65px;
      object-fit: cover;
      border-radius: 8px;
    }
    
    .cart-item-info {
      flex: 1;
    }
    
    .cart-item-name {
      font-weight: 600;
      color: var(--text);
      font-size: 0.875rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .cart-item-price {
      color: var(--primary);
      font-size: 0.75rem;
    }
    
    .audio-icon {
      color: var(--primary);
      font-size: 10px;
      margin-left: 4px;
    }
    
    .btn-remove {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 4px;
      cursor: pointer;
    }
    
    .cart-summary {
      background: var(--card);
      padding: 15px;
      margin-top: 15px;
    }
    
    .cart-total {
      font-size: 1rem;
      color: var(--text);
    }
    
    .cart-total strong {
      color: var(--primary);
    }
    
    .btn-continue {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: var(--text);
      border: none;
      border-radius: 25px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    
    /* ========== MODAL ========== */
