<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Biah Ferreira · Links Oficiais</title>
<meta name="description" content="Links oficiais e parcerias de Biah Ferreira."/>
<meta name="theme-color" content="#000000"/>
<meta property="og:title" content="Biah Ferreira · Links Oficiais"/>
<meta property="og:description" content="Parcerias e canais oficiais."/>
<meta property="og:image" content="foto.jpg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Syne:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#000;
    --text:#f7f0ea;
    --muted:#9a8b84;
    --rose:#f0a8b0;
    --rose2:#d47884;
    --gold:#e8d0b0;
    --gold2:#c9a87a;
    --font:'Outfit',system-ui,sans-serif;
    --display:'Cormorant Garamond',Georgia,serif;
    --display2:'Syne',system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#000;color:var(--text)}
  body{
    min-height:100dvh;font-family:var(--font);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* ——— ambient ——— */
  .stage{position:relative;min-height:100dvh;overflow:hidden}
  .glow{
    position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(80px);
  }
  .glow-1{
    width:60vw;height:60vw;max-width:480px;max-height:480px;
    top:-10%;left:50%;transform:translateX(-50%);
    background:radial-gradient(circle,rgba(212,100,120,.22),transparent 70%);
    animation:pulseG 7s ease-in-out infinite;
  }
  .glow-2{
    width:40vw;height:40vw;max-width:320px;max-height:320px;
    bottom:15%;left:10%;
    background:radial-gradient(circle,rgba(200,160,100,.12),transparent 70%);
  }
  .glow-3{
    width:35vw;height:35vw;max-width:280px;max-height:280px;
    bottom:20%;right:5%;
    background:radial-gradient(circle,rgba(180,80,100,.1),transparent 70%);
  }
  @keyframes pulseG{
    0%,100%{opacity:.9;transform:translateX(-50%) scale(1)}
    50%{opacity:1;transform:translateX(-50%) scale(1.08)}
  }
  .noise{
    position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .wrap{
    position:relative;z-index:2;
    max-width:430px;margin:0 auto;
    padding:20px 16px 48px;
  }

  /* ——— top bar ——— */
  .bar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:18px;
    animation:rise .6s cubic-bezier(.22,1,.36,1) both;
  }
  .bar-brand{
    font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.02em;
  }
  .bar-brand span{color:var(--gold)}
  .bar-live{
    display:inline-flex;align-items:center;gap:6px;
    font-size:9px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:#8fdfb8;padding:5px 10px;border-radius:999px;
    background:rgba(79,212,168,.08);border:1px solid rgba(79,212,168,.22);
  }
  .bar-live i{
    width:6px;height:6px;border-radius:50%;background:#4fd4a8;
    box-shadow:0 0 8px #4fd4a8;animation:blink 1.6s ease infinite;
  }
  @keyframes blink{50%{opacity:.3}}

  /* ——— title ——— */
  .hero-title{
    text-align:center;margin-bottom:6px;
    animation:rise .7s .05s cubic-bezier(.22,1,.36,1) both;
  }
  .hero-title h1{
    font-family:var(--display);
    font-size:clamp(40px,11vw,52px);font-weight:600;
    line-height:1;letter-spacing:.01em;
  }
  .hero-title h1 em{
    font-style:normal;
    background:linear-gradient(115deg,var(--gold) 0%,var(--rose) 45%,var(--gold2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-title p{
    margin-top:8px;font-size:13px;color:var(--muted);font-weight:400;
  }

  /* ——— SCENE: ela + botão (uma peça só) ——— */
  .scene{
    position:relative;
    margin:10px auto 0;
    animation:rise .8s .12s cubic-bezier(.22,1,.36,1) both;
  }

  /* vídeo: sem borda pesada — ela “solta” no preto */
  .figure{
    position:relative;
    width:100%;
    max-width:360px;
    margin:0 auto;
  }
  .figure video{
    display:block;width:100%;
    aspect-ratio:3/4.1;
    object-fit:cover;
    object-position:center 12%;
    background:transparent;
    /* máscara: some nas bordas → parece dentro do site */
    -webkit-mask-image:radial-gradient(ellipse 78% 72% at 50% 38%, #000 45%, transparent 78%);
    mask-image:radial-gradient(ellipse 78% 72% at 50% 38%, #000 45%, transparent 78%);
  }
  /* luz atrás dela */
  .figure-aura{
    position:absolute;left:50%;top:35%;
    width:70%;height:55%;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse,rgba(232,160,168,.18),transparent 70%);
    filter:blur(30px);pointer-events:none;z-index:-1;
  }

  /* fio de luz do dedo → botão */
  .beam{
    position:relative;
    height:36px;margin:-8px auto 0;
    width:2px;
    background:linear-gradient(to bottom,rgba(240,168,176,.55),rgba(240,168,176,.05));
    border-radius:2px;
  }
  .beam::before{
    content:'';position:absolute;left:50%;top:0;
    width:10px;height:10px;margin-left:-5px;margin-top:-4px;
    border-radius:50%;
    background:var(--rose);
    box-shadow:0 0 16px var(--rose),0 0 32px rgba(240,168,176,.4);
    animation:dot 1.5s ease-in-out infinite;
  }
  .beam::after{
    content:'';position:absolute;left:50%;bottom:-2px;
    width:8px;height:8px;margin-left:-4px;
    border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 14px var(--gold);
    animation:dot 1.5s .3s ease-in-out infinite;
  }
  @keyframes dot{
    0%,100%{opacity:.55;transform:scale(.85)}
    50%{opacity:1;transform:scale(1.15)}
  }

  /* BOTÃO PARCERIA — alvo do gesto */
  .target{
    position:relative;
    margin:0 auto;
    max-width:360px;
  }
  .target-label{
    text-align:center;
    font-size:9px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;
    color:var(--rose);margin-bottom:10px;opacity:.85;
  }
  .partner{
    display:flex;align-items:center;gap:14px;
    padding:18px 18px;
    border-radius:22px;
    text-decoration:none;color:var(--text);
    position:relative;overflow:hidden;
    background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.03));
    border:1px solid rgba(240,168,176,.35);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.04) inset,
      0 20px 50px rgba(0,0,0,.5),
      0 0 40px rgba(240,168,176,.12);
    transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s;
    animation:targetPulse 2.8s ease-in-out infinite;
  }
  @keyframes targetPulse{
    0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 20px 50px rgba(0,0,0,.5),0 0 40px rgba(240,168,176,.12)}
    50%{box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 20px 50px rgba(0,0,0,.5),0 0 56px rgba(240,168,176,.22)}
  }
  .partner:hover{
    transform:translateY(-3px) scale(1.015);
    border-color:rgba(240,168,176,.55);
    box-shadow:
      0 0 0 1px rgba(255,255,255,.06) inset,
      0 24px 56px rgba(0,0,0,.55),
      0 0 60px rgba(240,168,176,.25);
    animation:none;
  }
  .partner:active{transform:scale(.98)}
  .partner::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--rose),var(--gold));
  }
  /* shine sweep */
  .partner::after{
    content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
    transform:skewX(-20deg);
    animation:shine 4s ease-in-out infinite;
  }
  @keyframes shine{
    0%,100%{left:-60%}
    40%,60%{left:120%}
  }
  .p-ico{
    width:52px;height:52px;flex-shrink:0;border-radius:16px;
    display:grid;place-items:center;font-size:24px;
    background:linear-gradient(145deg,rgba(240,168,176,.28),rgba(228,201,165,.12));
    border:1px solid rgba(240,168,176,.35);
  }
  .p-body{flex:1;min-width:0}
  .p-body strong{
    display:block;font-size:16px;font-weight:700;letter-spacing:-.02em;margin-bottom:3px;
  }
  .p-body span{font-size:12px;color:var(--muted)}
  .p-tag{
    display:inline-block;margin-left:6px;vertical-align:middle;
    font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;
    background:rgba(240,168,176,.18);color:var(--rose);
    border:1px solid rgba(240,168,176,.3);
  }
  .p-go{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;
    background:rgba(240,168,176,.12);color:var(--rose);
    transition:transform .2s;
  }
  .partner:hover .p-go{transform:translateX(4px)}
  .p-go svg{width:15px;height:15px}

  /* ——— sociais ——— */
  .socials-block{
    margin-top:36px;text-align:center;
    animation:rise .75s .28s cubic-bezier(.22,1,.36,1) both;
  }
  .socials-block .lbl{
    font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--muted);margin-bottom:14px;
  }
  .socials{display:flex;justify-content:center;gap:14px}
  .social{
    width:56px;height:56px;border-radius:18px;
    display:grid;place-items:center;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.1);
    color:var(--text);text-decoration:none;
    transition:transform .2s,background .2s,border-color .2s,color .2s,box-shadow .2s;
  }
  .social:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.08);
    box-shadow:0 16px 36px rgba(0,0,0,.4);
  }
  .social svg{width:24px;height:24px}
  .social.ig:hover{color:#e1306c;border-color:rgba(225,48,108,.4)}
  .social.yt:hover{color:#ff4444;border-color:rgba(255,68,68,.4)}

  /* ——— footer ——— */
  footer{
    text-align:center;margin-top:40px;padding-top:24px;
    border-top:1px solid rgba(255,255,255,.06);
    animation:rise .75s .4s cubic-bezier(.22,1,.36,1) both;
  }
  footer .brand{
    font-family:var(--display);font-size:16px;font-weight:600;color:var(--gold);margin-bottom:4px;
  }
  footer p{font-size:11px;color:var(--muted)}

  @keyframes rise{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:none}
  }

  /* desktop: um pouco mais espaço */
  @media(min-width:480px){
    .wrap{padding-top:32px}
    .figure{max-width:380px}
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="noise"></div>

    <div class="wrap">

      <div class="bar">
        <div class="bar-brand">Biah <span>Ferreira</span></div>
        <div class="bar-live"><i></i> Ao vivo</div>
      </div>

      <header class="hero-title">
        <h1>Biah <em>Ferreira</em></h1>
        <p>Influencer · parcerias selecionadas</p>
      </header>

      <!-- CENA: ela aponta → fio de luz → botão -->
      <div class="scene">
        <div class="figure">
          <div class="figure-aura"></div>
          <video id="v" autoplay muted loop playsinline poster="foto.jpg">
            <source src="biah-intro-web.mp4" type="video/mp4"/>
          </video>
        </div>

        <div class="beam" aria-hidden="true"></div>

        <div class="target">
          <p class="target-label">Ela indica ↓</p>
          <a class="partner" href="https://www.ybera.com?parceiro=92819" target="_blank" rel="noopener noreferrer">
            <div class="p-ico">✨</div>
            <div class="p-body">
              <strong>Ybera Beauty <span class="p-tag">Parceira</span></strong>
              <span>Cosméticos &amp; cuidados — link exclusivo</span>
            </div>
            <div class="p-go">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </div>
          </a>
        </div>
      </div>

      <div class="socials-block">
        <p class="lbl">Me acompanhe</p>
        <div class="socials">
          <a class="social ig" href="https://www.instagram.com/biah.ferreira__" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">

          </a>
          <a class="social yt" href="https://www.youtube.com/@biah.ferreira" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">

          </a>
        </div>
      </div>

      <footer>
        <p class="brand">Biah Ferreira</p>
        <p>Parcerias oficiais · © <span id="y"></span></p>
      </footer>
    </div>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    var v = document.getElementById('v');
    if (v) {
      v.muted = true;
      var p = v.play();
      if (p && p.catch) p.catch(function(){});
    }
  </script>
</body>
</html>
